version: "3.8"

# E2E topology for the discovery hub. See docs/design/discovery-hub-e2e.md.
#
#   pd + tikv + tidb-0/1 (+ tidb-2 on the "scale" profile)
#   hub-0/hub-1: tiproxy in discovery mode, watching pd
#   sidecar:     tiproxy with a hub-sourced cluster, no PD access at all

services:
  pd:
    image: ${TIDB_CLUSTER_IMAGE_PREFIX:-pingcap/}pd:${TIDB_CLUSTER_VERSION:-v8.5.1}
    command:
      - --name=pd
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://pd:2380
    ports:
      # The scale scenarios sample the embedded-etcd counters from the host.
      - "42379:2379"

  tikv:
    image: ${TIDB_CLUSTER_IMAGE_PREFIX:-pingcap/}tikv:${TIDB_CLUSTER_VERSION:-v8.5.1}
    command:
      - --pd=pd:2379
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --status-addr=0.0.0.0:20180
      # Declare a small capacity so that a nearly-full host disk does not
      # trip the low-space protection (the e2e writes megabytes at most);
      # otherwise raft stops proposing and TiDB fails bootstrap.
      - --capacity=10GB
    depends_on:
      - pd

  tidb-0:
    image: ${TIDB_CLUSTER_IMAGE_PREFIX:-pingcap/}tidb:${TIDB_CLUSTER_VERSION:-v8.5.1}
    # @@hostname is the assertion fingerprint, so pin it to the service name.
    hostname: tidb-0
    command:
      - --store=tikv
      - --path=pd:2379
      - --advertise-address=tidb-0
    depends_on:
      - tikv

  tidb-1:
    image: ${TIDB_CLUSTER_IMAGE_PREFIX:-pingcap/}tidb:${TIDB_CLUSTER_VERSION:-v8.5.1}
    # @@hostname is the assertion fingerprint, so pin it to the service name.
    hostname: tidb-1
    command:
      - --store=tikv
      - --path=pd:2379
      - --advertise-address=tidb-1
    depends_on:
      - tikv

  # Started and stopped by the scale-out/in scenarios.
  tidb-2:
    image: ${TIDB_CLUSTER_IMAGE_PREFIX:-pingcap/}tidb:${TIDB_CLUSTER_VERSION:-v8.5.1}
    # @@hostname is the assertion fingerprint, so pin it to the service name.
    hostname: tidb-2
    profiles: ["scale"]
    command:
      - --store=tikv
      - --path=pd:2379
      - --advertise-address=tidb-2
    depends_on:
      - tikv

  # Never started before the total-hub-outage scenario: the sidecar must have
  # never seen it, to prove a genuinely new backend stays invisible without hubs.
  tidb-3:
    image: ${TIDB_CLUSTER_IMAGE_PREFIX:-pingcap/}tidb:${TIDB_CLUSTER_VERSION:-v8.5.1}
    # @@hostname is the assertion fingerprint, so pin it to the service name.
    hostname: tidb-3
    profiles: ["scale"]
    command:
      - --store=tikv
      - --path=pd:2379
      - --advertise-address=tidb-3
    depends_on:
      - tikv

  # The hubs are the PD-side tidb-discovery service (pd-server services
  # tidb-discovery), built from pingkai/pd. See Dockerfile.pd-discovery.
  hub-0:
    image: ${TIDB_DISCOVERY_IMAGE:-tidb-discovery:e2e}
    command:
      - --backend-endpoints=http://pd:2379
      - --listen-addr=http://0.0.0.0:3080
    ports:
      - "43081:3080"
    depends_on:
      - pd

  hub-1:
    image: ${TIDB_DISCOVERY_IMAGE:-tidb-discovery:e2e}
    command:
      - --backend-endpoints=http://pd:2379
      - --listen-addr=http://0.0.0.0:3080
    ports:
      - "43082:3080"
    depends_on:
      - pd

  # The canary for the pd->hub->pd migration scenario, started on demand.
  sidecar-pd:
    image: ${TIPROXY_IMAGE:-moonsphere/tiproxy:discovery-hub}
    entrypoint: ["/bin/tiproxy", "--config", "/etc/proxy-e2e/sidecar-pd.toml"]
    profiles: ["canary"]
    volumes:
      - ./conf:/etc/proxy-e2e:ro
    ports:
      - "46001:6000"
      - "43083:3080"
    depends_on:
      - pd

  sidecar:
    image: ${TIPROXY_IMAGE:-moonsphere/tiproxy:discovery-hub}
    entrypoint: ["/bin/tiproxy", "--config", "/etc/proxy-e2e/sidecar.toml"]
    volumes:
      - ./conf:/etc/proxy-e2e:ro
    ports:
      - "46000:6000"
      - "43080:3080"
    depends_on:
      - hub-0
      - hub-1

  # Scalable fleets for the P2 scale scenarios (S9/S10). No host ports: the
  # assertions go through the hub metrics, the PD counters, and docker exec.
  sidecar-fleet:
    image: ${TIPROXY_IMAGE:-moonsphere/tiproxy:discovery-hub}
    entrypoint: ["/bin/tiproxy", "--config", "/etc/proxy-e2e/sidecar.toml"]
    profiles: ["fleet-hub"]
    volumes:
      - ./conf:/etc/proxy-e2e:ro
    depends_on:
      - hub-0
      - hub-1

  sidecar-pd-fleet:
    image: ${TIPROXY_IMAGE:-moonsphere/tiproxy:discovery-hub}
    entrypoint: ["/bin/tiproxy", "--config", "/etc/proxy-e2e/sidecar-pd.toml"]
    profiles: ["fleet-pd"]
    volumes:
      - ./conf:/etc/proxy-e2e:ro
    depends_on:
      - pd
