syntax = "proto3";

// The proto package name determines the gRPC full method names
// (e.g. /tidb_discoverypb.TiDBDiscovery/Subscribe) and MUST stay stable:
// the server side may migrate into PD (as a microservice) in the future and
// only the go_package option and Go imports would change then, keeping the
// wire protocol identical.
package tidb_discoverypb;

option go_package = "github.com/pingcap/tiproxy/pkg/discovery/pb";

// TiDBDiscovery pushes the live TiDB topology of one PD cluster to
// subscribers (sidecar TiProxy instances), so that subscribers do not need
// to connect to PD directly.
service TiDBDiscovery {
  // Subscribe is a long-lived stream. The server always sends a full
  // snapshot first (full=true) and then deltas (full=false).
  rpc Subscribe(SubscribeRequest) returns (stream DiscoveryResponse);
}

message SubscribeRequest {
  // Filter by keyspaces. Empty means all keyspaces.
  // Reserved: the server ignores it and broadcasts everything for now.
  repeated string keyspaces = 1;
  // The revision that the client already has, used as a resume hint.
  // 0 means the client needs a full snapshot.
  // Reserved: the server ignores it and always sends a full snapshot on
  // (re)connect for now.
  int64 known_revision = 2;
  // The identity of the client, only for logging and metrics.
  string client_id = 3;
}

message DiscoveryResponse {
  // The etcd revision that this response is derived from, monotonic per hub.
  int64 revision = 1;
  // full=true: replace the whole local cache with `upserted`.
  // full=false: apply `upserted` and `removed_addrs` as a delta.
  bool full = 2;
  repeated TiDBInstance upserted = 3;
  // Addresses ("ip:port") of the instances that are gone.
  repeated string removed_addrs = 4;
  // The Prometheus of the cluster, piggy-backed when it changes.
  PrometheusInfo prometheus = 5;
}

message TiDBInstance {
  // addr is the "ip:port" SQL address and is the cache key.
  string addr = 1;
  string ip = 2;
  uint32 status_port = 3;
  map<string, string> labels = 4;
  string keyspace = 5;
  string version = 6;
}

message PrometheusInfo {
  string ip = 1;
  int32 port = 2;
  string binary_path = 3;
}
